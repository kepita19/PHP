<!DOCTYPE html>
<html lang="eu">
<head>
    <meta charset="UTF-8">
    <title>Datos personales</title>
</head>
<body>
    <h1>Datos personales</h1>
    <form action="02ariketaDatuak.php" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre">
        <br>
        <label for="apellidos">Apellidos:</label>
        <input type="text" id="apellidos" name="apellidos">
        <br>
        <label for="edad">Edad:</label>
        <input type="number" id="edad" name="edad">
        <br>
        <label for="peso">Peso:</label>
        <input type="number" id="peso" name="peso">
        <br>
        <span>Sexo:</span>
        <label><input type="radio" name="sexo" value="hombre"> Hombre</label>
        <label><input type="radio" name="sexo" value="mujer"> Mujer</label>
        <br>
        <span>Estado civil:</span>
        <label><input type="radio" name="estado_civil" value="soltero"> Soltero/a</label>
        <label><input type="radio" name="estado_civil" value="casado"> Casado/a</label>
        <label><input type="radio" name="estado_civil" value="viudo"> Viudo/a</label>
        <br>
        <span>Aficiones:</span>
        <label><input type="checkbox" name="aficiones[]" value="la música"> Música</label>
        <label><input type="checkbox" name="aficiones[]" value="los libros"> Libros</label>
        <label><input type="checkbox" name="aficiones[]" value="el cine"> Cine</label>
        <label><input type="checkbox" name="aficiones[]" value="el deporte"> Deporte</label>
        <br>
        <button type="submit">Bidali</button>
        <button type="reset">Ezabatu</button>
    </form>
</body>
</html>
